<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Plantilla WebAR</title>

  <!-- ==========================================================
       CONFIGURACIÓN · EDITA SOLO ESTE BLOQUE
       ========================================================== -->
  <script>
    const CONFIG = {
      // Título que aparece en pantalla (admite tildes y ñ)
      titulo: 'Mi experiencia en realidad aumentada',

      // Archivo .patt del marcador (créalo con generador.html)
      marcador: 'marcador.patt',

      // Tipo de contenido: 'modelo' o 'video'
      tipo: 'modelo',

      // Archivo dentro del repositorio. 'modelo': .glb  ·  'video': .mp4
      archivo: '3dmodel.glb',

      // Ajustes de posición. 1 = el ancho del cuadro negro del marcador
      // Dónde va a estar el marcador (solo cambia algo para 'modelo'):
      //   'mesa'  → marcador acostado (mesa, piso): el modelo queda de pie sobre el papel
      //   'pared' → marcador vertical (pared, pantalla, afiche): el modelo mira de frente a la cámara
      orientacion: 'pared',

      escala: 1,        // tamaño del contenido
      altura: 0,        // 'mesa': cuánto flota sobre el papel · 'pared': cuánto sube (negativo = baja)
      giro: 0,          // rotación en grados sobre su propio eje vertical (180 = lo voltea)
      animarGiro: true  // el modelo gira lentamente sobre sí mismo (solo para 'modelo')
    };
  </script>
  <!-- ========================================================== -->

  <!--
    LIBRERÍAS (no tocar)
    A-Frame 1.6.0 es la versión con la que AR.js documenta su compatibilidad.
    AR.js 3.4.8, build "aframe-ar": rastreo por marcador, funciona en Android e iPhone.
  -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.4.8/aframe/build/aframe-ar.js"></script>

  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; }

    #interfaz {
      position: fixed; inset: 0; z-index: 10; pointer-events: none;
      display: flex; flex-direction: column; justify-content: space-between;
      padding: 16px; box-sizing: border-box;
    }
    #estado {
      align-self: center; padding: 8px 14px; border-radius: 999px;
      background: rgba(0,0,0,.6); color: #fff; font-size: 14px;
    }
    #estado.visible { background: rgba(20,120,60,.8); }
    #pie {
      background: rgba(0,0,0,.65); color: #fff; border-radius: 14px; padding: 12px 16px;
      display: flex; align-items: center; gap: 12px;
    }
    #titulo { flex: 1; font-size: 16px; line-height: 1.3; }
    #sonido {
      display: none; pointer-events: auto; border: 0; border-radius: 10px;
      padding: 10px 12px; font-size: 14px; font-weight: 600; background: #fff; color: #111;
    }
    #error {
      position: fixed; left: 16px; right: 16px; top: 64px; z-index: 30; display: none;
      background: #b3261e; color: #fff; padding: 12px 14px; border-radius: 10px; font-size: 14px;
    }
  </style>
</head>
<body>

  <div id="interfaz">
    <div id="estado">Apunta la cámara al marcador</div>
    <div id="pie">
      <div id="titulo"></div>
      <button id="sonido">🔊 Activar sonido</button>
    </div>
  </div>

  <div id="error"></div>

  <a-scene
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono; patternRatio: 0.5; cameraParametersUrl: camera_para.dat;"
    xr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; colorManagement: true;"
    device-orientation-permission-ui="enabled: false">
    <a-assets timeout="15000"></a-assets>
    <!-- Iluminación para que los modelos 3D no se vean oscuros -->
    <a-entity light="type: ambient; intensity: 1.2"></a-entity>
    <a-entity light="type: directional; intensity: 1.8" position="1 4 2"></a-entity>
    <a-entity camera></a-entity>
  </a-scene>

  <!-- ===== FUNCIONAMIENTO (no necesitas editarlo) ===== -->
  <script>
    const escena  = document.querySelector('a-scene');
    const estado  = document.getElementById('estado');
    const sonido  = document.getElementById('sonido');
    document.getElementById('titulo').textContent = CONFIG.titulo;

    function mostrarError(texto) {
      const caja = document.getElementById('error');
      caja.textContent = caja.textContent ? caja.textContent + ' · ' + texto : texto;
      caja.style.display = 'block';
    }

    // Verifica que existan los archivos indispensables y avisa si falta alguno
    const calibracion = (HTMLElement.prototype.getAttribute.call(escena, 'arjs').match(/cameraParametersUrl:\s*([^;]+)/) || [])[1];
    [[calibracion, 'calibración de cámara'], [CONFIG.marcador, 'marcador'], [CONFIG.archivo, 'contenido']]
      .forEach(([ruta, nombre]) => {
        if (!ruta) return;
        fetch(ruta.trim(), { method: 'HEAD' }).then(r => {
          if (!r.ok) mostrarError(`No se encuentra el archivo de ${nombre}: "${ruta.trim()}". Revisa el nombre y la carpeta.`);
        }).catch(() => {});
      });

    // Marcador
    const marcador = document.createElement('a-marker');
    marcador.setAttribute('type', 'pattern');
    marcador.setAttribute('url', CONFIG.marcador);

    // Orientación: con el marcador en una pared, el modelo se inclina 90° para mirar a la cámara.
    // (El video ya queda pegado al plano del marcador, así que no necesita este ajuste.)
    const soporte = document.createElement('a-entity');
    if (CONFIG.orientacion === 'pared' && CONFIG.tipo === 'modelo') {
      soporte.setAttribute('rotation', '-90 0 0');
    } else if (CONFIG.orientacion && !['mesa', 'pared'].includes(CONFIG.orientacion)) {
      mostrarError(`Orientación desconocida: "${CONFIG.orientacion}". Usa 'mesa' o 'pared'.`);
    }
    marcador.appendChild(soporte);

    // Contenedor que aplica escala, altura y giro
    const contenido = document.createElement('a-entity');
    contenido.setAttribute('position', `0 ${CONFIG.altura} 0`);
    contenido.setAttribute('rotation', `0 ${CONFIG.giro} 0`);
    contenido.setAttribute('scale', `${CONFIG.escala} ${CONFIG.escala} ${CONFIG.escala}`);
    soporte.appendChild(contenido);

    let video = null;

    if (CONFIG.tipo === 'modelo') {
      const modelo = document.createElement('a-entity');
      modelo.setAttribute('gltf-model', `url(${CONFIG.archivo})`);
      if (CONFIG.animarGiro) {
        modelo.setAttribute('animation', 'property: rotation; to: 0 360 0; loop: true; dur: 12000; easing: linear');
      }
      modelo.addEventListener('model-error', () =>
        mostrarError(`No se pudo cargar el modelo "${CONFIG.archivo}". Revisa el nombre del archivo y que sea .glb.`));
      contenido.appendChild(modelo);

    } else if (CONFIG.tipo === 'video') {
      video = document.createElement('video');
      video.id = 'video-ar';
      video.src = CONFIG.archivo;
      video.setAttribute('crossorigin', 'anonymous');
      video.setAttribute('playsinline', '');
      video.setAttribute('webkit-playsinline', '');
      video.muted = true;   // obligatorio para que arranque solo en iPhone y Android
      video.loop = true;
      video.preload = 'auto';
      document.querySelector('a-assets').appendChild(video);

      const plano = document.createElement('a-video');
      plano.setAttribute('src', '#video-ar');
      plano.setAttribute('rotation', '-90 0 0');   // acostado sobre el papel
      plano.setAttribute('width', 1);
      plano.setAttribute('height', 0.5625);
      // Ajusta la proporción a la del video real
      video.addEventListener('loadedmetadata', () => {
        if (video.videoWidth) plano.setAttribute('height', video.videoHeight / video.videoWidth);
      });
      video.addEventListener('error', () =>
        mostrarError(`No se pudo cargar el video "${CONFIG.archivo}". Revisa el nombre y que sea .mp4 (H.264).`));
      contenido.appendChild(plano);

      sonido.style.display = 'block';
      sonido.addEventListener('click', () => {
        video.muted = !video.muted;
        video.play().catch(() => {});
        sonido.textContent = video.muted ? '🔊 Activar sonido' : '🔇 Silenciar';
      });

    } else {
      mostrarError(`Tipo de contenido desconocido: "${CONFIG.tipo}". Usa 'modelo' o 'video'.`);
    }

    escena.appendChild(marcador);

    // Reacción al marcador. Se espera un instante para ignorar detecciones falsas.
    let espera = null;
    marcador.addEventListener('markerFound', () => {
      clearTimeout(espera);
      espera = setTimeout(() => {
        estado.textContent = 'Marcador detectado';
        estado.classList.add('visible');
        if (video) video.play().catch(() => {});
      }, 350);
    });
    marcador.addEventListener('markerLost', () => {
      clearTimeout(espera);
      estado.textContent = 'Apunta la cámara al marcador';
      estado.classList.remove('visible');
      if (video) video.pause();
    });
  </script>
</body>
</html>
